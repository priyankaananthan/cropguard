{% extends "base.html" %}
{% block title %}Change Password — CropGuard AI{% endblock %}
{% block content %}
<div class="container my-5" style="max-width:420px;">
  <div class="card result-card p-4">
    <h5 class="mb-4"><i class="fa-solid fa-key text-success"></i> Update Admin Password</h5>
    <form method="POST" action="{{ url_for('admin_password') }}">
      <div class="mb-3">
        <label class="form-label">Current Password</label>
        <input type="password" name="current_password" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-control" required minlength="8">
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" required minlength="8">
      </div>
      <button type="submit" class="btn btn-cg w-100">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
