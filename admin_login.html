{% extends "base.html" %}
{% block title %}Admin Login — CropGuard AI{% endblock %}
{% block content %}
<div class="container my-5" style="max-width: 420px;">
  <div class="card result-card p-4">
    <h4 class="text-center mb-4"><i class="fa-solid fa-lock text-success"></i> Host / Admin Login</h4>
    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-cg w-100">Login</button>
    </form>
  </div>
</div>
{% endblock %}
